<!DOCTYPE html>
<html>
    <head>
        <title>Item Purchase App</title>
        <link rel="stylesheet" href="style.css">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body>
        <h2>🛒 Item <span>Purchase Management</span></h2>

        
<div class="app-layout">

    <div class="sidebar">
        <h3>📦 Item <span>Manager</span></h3>

        <a href="#dashboard" class="active">🏠 Dashboard</a>
        <a href="#addItem">➕ Add Item</a>
        <a href="#items">📋 Items List</a>
        <a href="#purchase">🛒 New Purchase</a>
        <a href="#history">📊 Purchase History</a>
    </div>

    <div class="main-content">

    <div class="stats-container" id="dashboard">

        <div class="stat-card">
            <div class="stat-icon blue">📦</div>
            <div>
                <p>Total Items</p>
                <h2 id="totalItems">0</h2>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon green">📊</div>
            <div>
                <p>Total Stock</p>
                <h2 id="totalStock">0</h2>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon purple">🛒</div>
            <div>
                <p>Total Purchases</p>
                <h2 id="totalPurchases">0</h2>
            </div>
        </div>

    </div>

    <div class="container">



            <div class="card" id="addItem">
        <h3>ADD/ EDIT ITEM</h3>
        <div class="row">
        <input type="text" id="itemName" placeholder="Item Name">
        <input type="date" id="itemDate">
        <input type="number" id="itemStock" placeholder="Stock">
        <select id="itemType"></select>
        <select id="itemActive">
       <option value="1">Active</option>
       <option value="0">Inactive</option>
       </select>
        </div>
        <br><br>
        <button class="btn-blue" id="addItemBtn" onclick="addItem()">Add Item</button>

        <button type="button" id="deleteBtn" onclick="deleteItem()"
         style="display:none; background-color:red; color:white;">
         Delete Item
        </button>
        </div>

 <div class="card" id="items">
        <h3>Items List</h3>
        <div id="itemsList"></div>
</div>

<div class="card" id="purchase">
        <h3>New Purchase</h3>
        <div class="row">
        <input type="text" id="orderId" placeholder="Auto Order ID" readonly style="background:#e2e8f0;">
        <input type="date" id="purchaseDate">
        <select id="purchaseItem"></select>
        <input type="number" id="purchaseQty" placeholder="Qty">
        </div>
        <br>
        <button class="btn-blue" onclick="addToPurchase()">Add to Purchase</button>

        <div class="cart-box" id="purchaseList">No items added yet...</div>
        <button class="btn-green" onclick="savePurchase()">✅ Save Purchase</button>
        </div>
   <div class="card" id="history">
        <h3>Purchase History</h3>
        <div id="purchaseHistory">Click below to view history...</div>
        <br>
        <button class="btn-blue" onclick="loadPurchaseHistory()">Show  History</button>
</div>
</div>
</div>

<script src="script.js"></script>
        
    </body>
</html>
